# ============================================================
# FILE: ansible.cfg
# PURPOSE: Ansible configuration file
# ============================================================
# This is the first file Ansible looks for when you run a command.
# It tells Ansible:
#   - Where to find the list of servers (inventory)
#   - Don't ask "are you sure?" for SSH connections
#   - How long to wait before timing out
#
# Without this file, you'd have to pass flags every time:
#   ansible-playbook -i inventory.ini playbook.yml
# With this file, Ansible picks up settings automatically.
# ============================================================

[defaults]
inventory = inventory.ini
host_key_checking = False
timeout = 30
remote_user = ubuntu
private_key_file = ./ipsr-key.pem

[privilege_escalation]
become = True
become_method = sudo
become_user = root
